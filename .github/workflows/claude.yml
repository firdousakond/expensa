name: Claude Code

# AI assistant + code review. Advisory only — it never merges, and runs with
# read-only repository permissions. Requires an ANTHROPIC_API_KEY repo secret.
on:
  # Ask the agent by mentioning @claude in an issue or PR comment.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # Automatic review when a PR is opened or updated.
  pull_request:
    types: [opened, synchronize]

# Read-only on code (never modifies the repo); write on PRs/issues only so it
# can post its advisory review comment.
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    # Auto-review on PR events, OR when someone types "@claude" in a comment.
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >
            Review this change against the rules in CLAUDE.md. Focus on:
            architecture boundaries (domain in :core, no business logic in
            platform apps or ViewModels, apps never call a model provider
            directly), coroutine/Flow misuse, money represented as Long minor
            units (never Double), and missing tests for new public functions.
            Be concise and advisory; do not request changes that conflict with
            CLAUDE.md.
